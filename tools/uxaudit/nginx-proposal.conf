# ============================================================================
# PROPOSITION nginx pour atlas.disky.me — À RELIRE ET APPLIQUER MANUELLEMENT.
# Rien ici n'est appliqué automatiquement. Chaque bloc est justifié par une
# mesure du 2026-08-24 (voir baseline.json / rapport.md).
#
# Je n'ai pas accès à ta configuration actuelle : ceci est un server block
# de référence à fusionner avec l'existant, pas un diff ligne à ligne.
# nginx observé : 1.22.1 (en-tête Server).
# ============================================================================

server {
    listen 443 ssl;
    # ── MESURÉ : ALPN négocie http/1.1 alors que les clients offrent h2. ──
    # nginx 1.22 : ajouter http2 sur la ligne listen ; (syntaxe moderne
    # "http2 on;" seulement à partir de nginx 1.25.1).
    listen 443 ssl http2;

    server_name atlas.disky.me;

    # ── HTTP/3 (optionnel) ──────────────────────────────────────────────────
    # MESURÉ : aucun en-tête alt-svc, HTTP/3 non proposé. nginx 1.22 Debian ne
    # supporte pas QUIC ; il faudrait nginx >= 1.25 (paquet nginx.org) :
    #   listen 443 quic reuseport;
    #   add_header Alt-Svc 'h3=":443"; ma=86400' always;
    # + ouvrir 443/udp dans le pare-feu. À faire seulement si tu mets à jour
    # nginx ; sinon HTTP/2 couvre déjà l'essentiel du gain (multiplexage).

    # ── TLS ────────────────────────────────────────────────────────────────
    # MESURÉ : TLS 1.3 fonctionne (X25519 / AES-256-GCM), certificat OK.
    # Reprises de session + OCSP stapling (réduit le coût du handshake,
    # pertinent sans CDN car chaque visiteur paie le handshake chez toi) :
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ── Sécurité ───────────────────────────────────────────────────────────
    # MESURÉ : Strict-Transport-Security absent en prod. L'app émet HSTS via
    # UseHsts() mais seulement quand elle croit être en HTTPS ; le correctif
    # ForwardedHeaders (commit app) répare ça. Si tu préfères le gérer ici :
    # add_header Strict-Transport-Security "max-age=31536000" always;
    # (une seule des deux couches doit l'émettre — l'app le fait après le
    # correctif, donc ce add_header est optionnel/redondant.)
    # X-Content-Type-Options et Referrer-Policy sont désormais émis par l'app.

    # ── Compression ────────────────────────────────────────────────────────
    # MESURÉ : le HTML est gzippé (75 KB → 15 KB, ratio 0,20) mais PAS en
    # brotli, et sans Vary. Les assets statiques arrivent déjà pré-compressés
    # en brotli par Kestrel (MapStaticAssets) : nginx ne doit PAS les
    # recompresser (il ne le fait pas : Content-Encoding déjà posé — OK).
    gzip on;
    gzip_vary on;                 # MESURÉ : Vary: Accept-Encoding absent sur le HTML
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/html text/plain text/css application/javascript application/json image/svg+xml;
    # Brotli sur le HTML (module ngx_brotli, si dispo sur Debian: libnginx-mod-http-brotli) :
    #   brotli on; brotli_comp_level 5; brotli_types text/html application/json;
    # Gain mesuré sur / : gzip 15,0 KB vs brotli ~12 KB estimé. Marginal :
    # à ne faire que si le module est déjà packagé, sinon coût > gain.

    # ── WebSocket Blazor (_blazor) ─────────────────────────────────────────
    # MESURÉ : le circuit passe bien en WebSocket (pas de long-polling), donc
    # l'upgrade fonctionne. Ce bloc fige les réglages qui le garantissent et
    # allonge le timeout d'inactivité : proxy_read_timeout par défaut = 60 s ;
    # les pings SignalR (KeepAliveInterval 15 s) le maintiennent normalement,
    # mais un timeout explicite large évite toute déconnexion d'onglet inactif
    # si un jour le keep-alive change.
    location /_blazor {
        proxy_pass http://127.0.0.1:5119;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;          # jamais de buffering sur un flux temps réel
        proxy_read_timeout 3600s;     # >> KeepAliveInterval (15 s)
        proxy_send_timeout 3600s;
    }

    # ── Polices ────────────────────────────────────────────────────────────
    # MESURÉ : les woff2 auto-hébergés sortent de Kestrel en no-cache (assets
    # non fingerprintés). L'app pose maintenant un Cache-Control 7 j dessus
    # (commit app) ; rien à faire ici. Ne PAS ajouter d'expires sur /,
    # le HTML doit rester no-cache (antiforgery + état par circuit).

    # ── Rate limiting (ABSENT aujourd'hui — à valider avant application) ──
    # Sans Cloudflare devant, aucune protection. Proposition douce qui ne
    # gêne pas un lecteur normal (une page ≈ 15 requêtes la première fois) :
    #   limit_req_zone $binary_remote_addr zone=atlas:10m rate=30r/s;
    #   ... dans location / :  limit_req zone=atlas burst=60 nodelay;
    # et pour les connexions : limit_conn_zone $binary_remote_addr zone=conn:10m;
    #   limit_conn conn 20;
    # ATTENTION : /_blazor utilise 1 WebSocket long par onglet — exclure ce
    # location du limit_req, garder seulement limit_conn.

    location / {
        proxy_pass http://127.0.0.1:5119;
        proxy_http_version 1.1;      # nécessaire pour les keep-alive upstream
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # requis par le correctif ForwardedHeaders
    }
}
