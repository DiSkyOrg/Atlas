# atlas.disky.me — version corrigée de la config fournie le 2026-08-25.
# À déposer à la place du site actuel, puis :  nginx -t && systemctl reload nginx
# Les blocs "managed by Certbot" sont conservés à l'identique.
#
# Changements vs ta version (chacun justifié par une mesure de l'audit) :
#   1. http2 sur le listen 443            (ALPN à confirmer côté client, cf. rapport)
#   2. map $http_upgrade                  (Connection: upgrade seulement pour les vrais WS ;
#                                          ta version l'envoyait sur TOUTES les requêtes,
#                                          ce qui casse le keep-alive vers Kestrel)
#   3. gzip_vary on + types explicites    (Vary: Accept-Encoding absent mesuré)
#   4. OCSP stapling                      (absent ; le cache de session TLS est déjà géré
#                                          par options-ssl-nginx.conf de Certbot)
#   5. client_max_body_size 10m           (50G sur une doc = surface DoS gratuite ;
#                                          remonte-le si ce vhost reçoit de vrais uploads)
#   6. server_tokens off                  (l'en-tête exposait nginx/1.22.1)
#   7. HSTS : PAS ajouté ici — l'app l'émet elle-même une fois le commit
#      "server: forwarded headers…" déployé (elle lit X-Forwarded-Proto que tu
#      transmets déjà). Une seule couche doit l'émettre.
#   8. HTTP/3 : impossible sur nginx 1.22 (il faudrait ≥ 1.25 via le dépôt
#      nginx.org + ouvrir 443/udp). HTTP/2 couvre l'essentiel du gain.
#   9. Rate limiting : bloc prêt mais COMMENTÉ — décision à toi. Sans
#      Cloudflare devant, il n'y a aujourd'hui aucune protection.

# Connection: upgrade uniquement quand le client demande un upgrade (WebSocket
# _blazor) ; sinon connexion keep-alive normale vers Kestrel.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";
}

# — Rate limiting (décommenter pour activer) —
# Une visite de page ≈ 15 requêtes la première fois ; 30 r/s + burst 60 ne gêne
# aucun humain. limit_req exclut les WebSockets longs (voir location /_blazor).
#limit_req_zone  $binary_remote_addr zone=atlas_req:10m  rate=30r/s;
#limit_conn_zone $binary_remote_addr zone=atlas_conn:10m;

server {
    server_name atlas.disky.me;

    server_tokens off;

    # 50G était une surface d'abus gratuite : ce site ne reçoit aucun upload.
    client_max_body_size 10m;

    proxy_read_timeout 3600s;     # > KeepAliveInterval SignalR (15 s) : onglets
    proxy_send_timeout 3600s;     # inactifs jamais coupés par le proxy
    client_body_timeout 60s;      # 3600s n'est utile que pour d'énormes uploads

    # Compression du HTML généré par Kestrel (les CSS/JS fingerprintés arrivent
    # déjà pré-compressés en brotli par l'app : nginx les laisse passer tels
    # quels). Mesuré : 75 Ko -> 15 Ko sur /.
    gzip on;
    gzip_vary on;                 # Vary: Accept-Encoding manquait
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml;   # text/html est toujours inclus

    # WebSocket Blazor : mêmes réglages que le reste + exclusion du limit_req
    # (1 connexion longue par onglet). Vérifie après reload que _blazor répond
    # "101 Switching Protocols" dans l'onglet Réseau.
    location /_blazor {
        proxy_pass http://localhost:5159;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        #limit_conn atlas_conn 20;
    }

    location / {
        proxy_pass http://localhost:5159;
        proxy_http_version 1.1;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        #limit_req  zone=atlas_req burst=60 nodelay;
        #limit_conn atlas_conn 20;
    }

    # OCSP stapling : RETIRÉ après vérification — Let's Encrypt a arrêté OCSP
    # en 2025, le certificat ne contient plus d'URL de répondeur (seulement
    # CA Issuers), donc ssl_stapling est sans effet avec ce cert. La révocation
    # passe désormais par les CRL côté navigateur ; rien à configurer ici.

    listen 443 ssl http2; # managed by Certbot (+ http2 ajouté)
    ssl_certificate /etc/letsencrypt/live/atlas.disky.me/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/atlas.disky.me/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = atlas.disky.me) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name atlas.disky.me;
    listen 80;
    return 404; # managed by Certbot
}
