services:
  diskyatlas:
    image: diskyatlas
    build:
      context: .
      dockerfile: Dockerfile
    container_name: diskyatlas
    restart: unless-stopped
    ports:
      # host:container — change 5159 on the left if the port is taken on the server
      - "5159:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
